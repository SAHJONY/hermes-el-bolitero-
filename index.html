<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0B141A"/>
<title>HERMES EL BOLITERO</title>
<style>
html,body{margin:0;background:#0B141A;color:#F4EFE4;font-family:system-ui,sans-serif}
#root{min-height:100vh}
#boot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px}
#boot .ball{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#cfd9dd 70%);animation:b 1s ease-in-out infinite alternate}
@keyframes b{from{transform:translateY(0)}to{transform:translateY(-14px)}}
#booterr{display:none;padding:22px;color:#FF8A8A;white-space:pre-wrap;font-size:13px}
/* worldwide translate widget — neutralize Google's banner, keep our layout */
.goog-te-banner-frame,.goog-te-gadget-icon,.skiptranslate iframe{display:none!important}
body{top:0!important}
#xlate{position:fixed;top:8px;right:10px;z-index:99999;background:rgba(19,34,43,.92);border:1px solid rgba(244,239,228,.18);border-radius:999px;padding:3px 8px;font-size:12px;backdrop-filter:blur(8px)}
#xlate .goog-te-gadget{color:#8AA0AB;font-size:0}
#xlate .goog-te-gadget .goog-te-combo{color:#F4EFE4;background:transparent;border:none;font-family:system-ui,sans-serif;font-size:12px;padding:2px}
#xlate .goog-te-combo option{color:#111}
</style>
</head>
<body>
<div id="xlate" title="🌐 Idioma / Language"></div>
<script>
function googleTranslateElementInit(){try{new google.translate.TranslateElement({pageLanguage:"es",autoDisplay:false},"xlate");}catch(e){}}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<div id="root">
<div id="boot"><div class="ball"></div><div style="color:#FFB838;font-weight:700;letter-spacing:.18em">HERMES EL BOLITERO</div><div style="color:#8AA0AB;font-size:13px">cargando la bola…</div></div>
<div id="booterr"></div>
</div>
<script>
/* Fix Google Translate vs React: Google Translate wraps text in <font> tags;
   when React re-renders (e.g. switching tabs) it tries to remove/insert DOM
   nodes it didn't create and throws "removeChild"/"insertBefore" errors, which
   breaks the page after translating. Make those DOM ops defensive so the
   translation survives navigation between tabs. */
(function(){
  if(typeof Node!=="function"||!Node.prototype) return;
  var rc=Node.prototype.removeChild;
  Node.prototype.removeChild=function(child){
    if(child&&child.parentNode!==this){ return child; }
    return rc.apply(this,arguments);
  };
  var ib=Node.prototype.insertBefore;
  Node.prototype.insertBefore=function(newNode,ref){
    if(ref&&ref.parentNode!==this){ return newNode; }
    return ib.apply(this,arguments);
  };
})();
function bootErr(m){var e=document.getElementById("booterr"),b=document.getElementById("boot");if(b)b.style.display="none";e.style.display="block";e.textContent="No pude arrancar:\n\n"+m+"\n\nRefresca; si sigue, copia esto al administrador.";}
window.addEventListener("error",function(e){bootErr(e.message||e.type)},true);
window.__HB_PROD=true;
(function(){var K=function(k,s){return (s?"shared":"local")+":"+k};
// Shared data goes to the native DB (/api/db) when a store is connected; otherwise
// it transparently falls back to localStorage. Private data is always local.
async function db(op,payload){try{var r=await fetch("/api/db",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({op:op},payload))});if(!r.ok)return null;var d=await r.json();if(!d||d.configured===false)return null;return d;}catch(e){return null;}}
window.storage={
get:async function(k,s){
  if(s){var d=await db("get",{key:k});
    if(d&&d.value!=null){try{localStorage.setItem(K(k,true),d.value);}catch(e){}return{key:k,value:d.value,shared:true};}
    if(d){var lv=localStorage.getItem(K(k,true));if(lv!==null){try{await db("set",{key:k,value:lv});}catch(e){}return{key:k,value:lv,shared:true};}throw new Error("nf");}}
  var v=localStorage.getItem(K(k,!!s));if(v===null)throw new Error("nf");return{key:k,value:v,shared:!!s};},
set:async function(k,v,s){
  if(s){await db("set",{key:k,value:v});}
  try{localStorage.setItem(K(k,!!s),v);}catch(e){}return{key:k,value:v,shared:!!s};},
"delete":async function(k,s){
  if(s){await db("del",{key:k});}
  localStorage.removeItem(K(k,!!s));return{key:k,deleted:true,shared:!!s};},
list:async function(p,s){p=p||"";
  if(s){var d=await db("list",{prefix:p});if(d&&d.keys){return{keys:d.keys,prefix:p,shared:true};}}
  var ks=Object.keys(localStorage).filter(function(x){return x.indexOf(K(p,!!s))===0}).map(function(x){return x.split(":").slice(1).join(":")});return{keys:ks,prefix:p,shared:!!s}}};})();
</script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script>
var V=Date.now();
Promise.all(["/app/p1.txt","/app/p2.txt","/app/p3.txt","/app/p4.txt"].map(function(u){
  return fetch(u+"?v="+V).then(function(r){if(!r.ok)throw new Error("Falta "+u+" ("+r.status+")");return r.text();});
})).then(function(parts){
  var code=parts.join("\n");
  var out=Babel.transform(code,{presets:["react"],filename:"app.jsx"}).code;
  (0,eval)(out);
}).catch(function(e){bootErr(e.message||String(e))});
</script>
</body>
</html>
